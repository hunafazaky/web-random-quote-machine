<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <title>HZ | Random Quote Machine</title>
  </head>
  <body>
    <main class="flex justify-center pt-10">
      <article class="w-3/5 bg-gray-300 p-5 rounded-xl border border-gray-500 shadow-xs shadow-gray-500" id="quote-box">
        <p class="text-lg font-bold italic text-center" id="text">"Kutipan"</p>
        <p class="text-lg font-bold italic text-red-900 text-end" id="author">- Author</p>
        <div class="mt-5">
          <button class="bg-blue-500 hover:bg-gray-300 border-2 border-transparent hover:border-blue-500 text-sm font-medium px-2 py-1 rounded" id="new-quote">Kutipan Baru</button>
          <a class="bg-green-500 hover:bg-gray-300 border-2 border-transparent hover:border-green-500 text-sm font-medium px-2 py-1 rounded" href="#" target="_blank" id="tweet-quote">Tweet Kutipan Ini</a>
        </div>
      </article>
      <script src="script.js"></script>
    </main>
  </body>
</html>
